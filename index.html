<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoply</title>
  </head>

  <body>
    <header class="border-b border-slate-200 bg-white">
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-5 lg:px-8"
      >
        <a
          href="index.html"
          class="text-2xl font-bold tracking-tight text-slate-900"
        >
          Shoply
        </a>

        <nav class="flex items-center gap-6 text-sm font-medium text-slate-600">
          <a
            href="index.html"
            class="transition hover:text-slate-900"
          >
            Home
          </a>

          <a
            href="cart.html"
            class="transition hover:text-slate-900"
          >
            Cart
          </a>

          <a
            href="login.html"
            id="auth-link"
            class="rounded-lg bg-slate-900 px-4 py-2 text-white transition hover:bg-slate-700"
          >
            Login
          </a>
        </nav>
      </div>
    </header>

    <div id="app" class="mx-auto max-w-7xl px-5 py-10 lg:px-8">
      <section class="mb-10">
        <div class="mb-7">
          <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
            Discover Products
          </h1>

          <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-500 sm:text-base">
            Find something you love from our collection of products.
          </p>
        </div>

        <div class="flex flex-col gap-3 lg:flex-row">
          <div class="flex flex-1 gap-2">
            <input
              type="search"
              id="search-input"
              placeholder="Search products..."
              class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
            />

            <button
              id="search-btn"
              class="rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-700"
            >
              Search
            </button>
          </div>

          <div class="flex flex-col gap-3 sm:flex-row">
            <select
              id="category-select"
              class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
            >
              <option value="">All Categories</option>
            </select>

            <select
              id="sort-select"
              class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-600 outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
            >
              <option value="">Sort Products</option>
              <option value="title-asc">Name: A-Z</option>
              <option value="title-desc">Name: Z-A</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating-desc">Rating: Highest First</option>
              <option value="rating-asc">Rating: Lowest First</option>
            </select>
          </div>
        </div>
      </section>

      <section>
        <div
          id="product-container"
          class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        ></div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
